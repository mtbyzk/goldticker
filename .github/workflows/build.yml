name: Build GoldTicker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: theos/theos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks" 2>/dev/null | tail -5 || true

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: goldticker-deb
          path: packages/*.deb
          if-no-files-found: warn
