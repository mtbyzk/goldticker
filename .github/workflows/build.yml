name: Build GoldTicker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid dpkg xz

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Fix script permissions
        run: chmod +x layout/DEBIAN/postinst layout/DEBIAN/preinst layout/DEBIAN/prerm layout/DEBIAN/postrm 2>/dev/null || true

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: goldticker-deb
          path: packages/*.deb
          if-no-files-found: warn
